services:
  norun-app:
    build: .
    container_name: norun_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/.data
    volumes:
      - ./data:/app/.data
    networks:
      - norun-network

  caddy:
    image: caddy:2-alpine
    container_name: norun_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - norun-network
    depends_on:
      - norun-app

networks:
  norun-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
